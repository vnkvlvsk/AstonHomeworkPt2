# Served only to spring.application.name=api-gateway.
# Routes are resolved by service discovery (lb://<spring.application.name>) instead of
# hardcoded host:port, so user-service/notification-service can move or scale freely.
# Each route also carries a CircuitBreaker filter: if the downstream is slow or down,
# calls fail fast instead of piling up threads, and fall back to a local degraded
# response (FallbackController) instead of leaking a raw 500/timeout to the client.
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=user-service-cb
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/users

spring.cloud.gateway.server.webmvc.routes[1].id=notification-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=notification-service-cb
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/notifications

# Fail a hung backend call instead of waiting forever, so the circuit breaker actually
# sees a failure (standard Spring Boot HTTP client property, not gateway-specific).
spring.http.client.read-timeout=4s

# Open the circuit once >=50% of the last 10 calls failed/timed out; stay open 10s
# before letting a handful of trial calls back through (half-open).
resilience4j.circuitbreaker.instances.user-service-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service-cb.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.notification-service-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.notification-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification-service-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notification-service-cb.permitted-number-of-calls-in-half-open-state=3

management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers
